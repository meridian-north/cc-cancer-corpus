name: General research question
description: Propose a literature question or mechanism topic, without a personal case.
title: "[Research question] "
body:
  - type: markdown
    attributes:
      value: "No personal case submissions. Do not include your regimen, doses, symptoms, test results, dates, identity or attachments. This public forum is not a clinical service."
  - type: textarea
    id: question
    attributes:
      label: General literature question
      description: "Example: Which controlled studies examine melatonin alongside platinum chemotherapy, and which outcomes were measured?"
    validations:
      required: true
  - type: input
    id: sources
    attributes:
      label: Published identifiers or existing topic
      description: Optional DOI, PMID, NCT or corpus topic. An unanswered question does not need a personal story.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public contribution check
      options:
        - label: This is a general research question with no personal clinical information.
          required: true
